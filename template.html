<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Quote Demo</title>
  <!--
  ══════════════════════════════════════════════════════════════════════════════
   SELF-PLAYING QUOTE-AGENT SAMPLE  ·  master template (clone this per client)
  ══════════════════════════════════════════════════════════════════════════════
   The engine + styles live ONCE in /quote-agent.js and /quote-agent.css.
   This file holds ONLY the four data blocks below, so a new demo is tiny.

   To make a new demo:
     1. Copy this file to  <clientname>.html
     2. Edit the 4 blocks: THEME, CONFIG, MSGS, EST  (nothing else)
     3. Drop their logo in this folder, set CONFIG.brand.logoSrc (web-safe name)
     4. Add a row to index.html, commit & push  →  served at /<clientname>

   Rules of thumb:
     · Keep the FIRST agent line as "Would you like a quote for your {niche}?"
     · Make EST.items sum EXACTLY to EST.mid
     · Keep EST.budget bracketing EST.mid (shows a green "budget match")
     · The Calendly link is FIXED for every sample — leave it as-is
   To change behaviour/look for ALL demos at once, edit quote-agent.js / .css.
  ══════════════════════════════════════════════════════════════════════════════
  -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
<body>
<div class="page-center" id="hero"></div>
<div id="widget-root"></div>

<script>
// 1. THEME — brand colours. Change the ~5 "core" hexes to re-skin (bg/dark/mid/brand/bright).
const THEME = {
  bg:'#0f1c14',      // core · page background behind the logo
  dark:'#13311f',    // core · darkest brand shade (gradient start, big numbers)
  mid:'#1b4a2e',     // core · mid brand shade
  brand:'#2e7d4f',   // core · primary brand colour (buttons, user bubbles)
  bright:'#46a866',  // core · lighter brand accent (highlights, online dot)
  dot:'#5fd089', chatBg:'#f3f8f4', tint:'#e6f4ea', tint2:'#eefaf0', line:'#e3eee6',
  ink:'#1f5e38', inkSoft:'#1f6b3f', ring:'rgba(46,125,79,0.40)',
  cta:'#f59e0b', cta2:'#d97706',   // Calendly button — amber pops on every brand, leave as-is
}

// 2. CONFIG — company identity (Calendly link is fixed for every sample)
const CONFIG = {
  brand: {
    name: 'Apex Roofing',
    sub: 'Roofing · Guttering · Leadwork',
    tagline: 'Guildford · Instant quote system',
    initial: 'A',
    logoSrc: '',     // e.g. 'apex-logo.jpg' (web-safe name, no spaces). '' = use the initial.
    fbHandle: '',    // or an FB page handle to pull their pic. logoSrc wins if both set.
    online: 'Online · Replies in seconds',
  },
  niche: 'roofing project',           // fills the opening line: "…a quote for your {niche}?"
  tooltip: 'See how it works ▶',
  currency: { symbol: '£', locale: 'en-GB' },
  sendToOwnerLabel: 'Send to owner →',
  calendly: 'https://calendly.com/pirint-milan/quoting-agent-sample',
  ctaTitle: 'This is just a sample.',
  ctaText: 'Want this on your own site, capturing real leads like this around the clock?',
  ctaButton: 'Book a 15-min call →',
}

// 3. MSGS — the conversation (plays itself, always the same single route)
const MSGS = [
  { r:'agent', t:"Hi! Would you like a quote for your roofing project?" },
  { r:'user',  t:"Yes please" },
  { r:'agent', t:"Great. Is it a full re-roof, a replacement, or a repair?" },
  { r:'user',  t:"A full re-roof" },
  { r:'agent', t:"Got it. What's the current covering — and does it need stripping off?" },
  { r:'user',  t:"Old concrete tiles — they'll need to come off" },
  { r:'agent', t:"Understood. Roughly how big is the roof? (m² or rough dimensions is fine)" },
  { r:'user',  t:"About 130 square metres" },
  { r:'agent', t:"130 m² noted. What shape is the roof — gable, hipped, or something else?" },
  { r:'user',  t:"Gable, two-sided" },
  { r:'agent', t:"Which covering would you like — concrete tile, clay, slate or metal?" },
  { r:'user',  t:"Concrete interlocking tiles" },
  { r:'agent', t:"Good choice. Are the rafters and timbers sound, or might they need attention?" },
  { r:'user',  t:"I think they're fine, but I'd want a roofer to check" },
  { r:'agent', t:"We check them as standard. Any chimney or roof windows needing extra work?" },
  { r:'user',  t:"Yes — one chimney and two Velux windows" },
  { r:'agent', t:"Should the guttering be replaced too, or is it staying?" },
  { r:'user',  t:"Replace it — it's rusted through" },
  { r:'agent', t:"What's the site postcode?" },
  { r:'user',  t:"GU1 4AB" },
  { r:'agent', t:"Roughly what budget did you have in mind?" },
  { r:'user',  t:"Between £10,000 and £13,000" },
  { r:'agent', t:"And your name?" },
  { r:'user',  t:"James Carter" },
  { r:'agent', t:"Thanks James — best number to reach you on?" },
  { r:'user',  t:"07700 900321" },
  { r:'agent', t:"And your email?" },
  { r:'user',  t:"james.carter@gmail.com" },
  { r:'agent', t:"Thanks James — putting your quote together now." },
  { r:'estimate' }
]

// 4. EST — itemised quote + lead card (items must sum to EST.mid)
const EST = {
  lower: 11_200, mid: 12_800, upper: 14_500,
  status: 'PRIORITY',
  items: [
    { label:'Concrete interlocking tiles — material', amt: 2_860 },
    { label:'Strip & dispose old covering',           amt:   950 },
    { label:'Roof timber check + minor repair',       amt:   480 },
    { label:'Breathable membrane + battens',          amt: 1_170 },
    { label:'Chimney lead flashing',                  amt:   620 },
    { label:'2× Velux reflashing',                    amt:   540 },
    { label:'Guttering replacement (≈38 lm)',         amt:   780 },
    { label:'Scaffolding (2-week hire)',              amt: 1_450 },
    { label:'Installation — labour',                  amt: 2_900 },
    { label:'Project management (6%)',                amt:   705 },
    { label:'Contingency (3%)',                       amt:   345 },
  ],
  customer: {
    'Name':'James Carter',
    'Phone':'07700 900321',
    'Email':'james.carter@gmail.com',
  },
  timingShort: 'Spring · Mar–Apr',
  jobTags: ['Concrete tile re-roof', '130 m² gable roof', '1 chimney', '2× Velux', 'New guttering'],
  budget: { low: 10_000, high: 13_000 },
  score: 95, scoreLabel: 'Premium Lead',
  clientCity: 'Guildford', clientZip: 'GU1 4AB',
  companyCity: 'Woking', distanceMi: 7,
}
</script>
<script src="/quote-agent.js"></script>
</body>
</html>
